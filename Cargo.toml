[package]
name = "shoji-bar-4"
version = "0.1.0"
edition = "2024"
description = "A Material 3 Expressive desktop shell for ShojiWM, built on AntiWebUI"
license = "MIT OR Apache-2.0"

[dependencies]
anti-webui = { path = "../../Documents/development/AntiWebUI/src/anti-webui", features = ["wayland-shell", "shell-network", "shell-battery", "shell-power-profiles", "shell-bluetooth", "shell-media", "shell-notifications", "shell-tray", "shell-session", "shell-audio", "shell-apps", "shell-process", "shell-system"] }
anti-webui-md3e = { path = "../../Documents/development/AntiWebUI/src/anti-webui-md3e" }
serde_json = "1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }

[features]
## Links AntiWebUI dynamically for faster rebuilds while developing.
dynamic_linking = ["anti-webui/dynamic_linking"]

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
lto = "thin"
strip = true
